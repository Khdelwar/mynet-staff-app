name: Release APK

# Builds the staff APK, signed with MyNet's own key.
# Run it by hand: Actions -> Release APK -> Run workflow.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    the keystore file, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_PASSWORD       the key password (leave unset if it is the same)
#   ANDROID_KEY_ALIAS          the key alias (leave unset for "mynet")
#   ERP_BASE_URL               https://... of the ERP
#
# The same keystore must be used for every release, or phones cannot update.
# It may be the customer app's keystore; the app id (net.mynet.staff) differs.

on:
  workflow_dispatch:

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ERP_BASE_URL: ${{ secrets.ERP_BASE_URL }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets are required."
            exit 1
          fi
          case "$ERP_BASE_URL" in
            https://*) ;;
            *) echo "::error::ERP_BASE_URL secret (https://...) is required."; exit 1 ;;
          esac
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-mynet}"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/app/key.properties

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build
        env:
          ERP_BASE_URL: ${{ secrets.ERP_BASE_URL }}
        run: >
          flutter build apk --release
          --obfuscate
          --split-debug-info=build/app/outputs/symbols
          --target-platform android-arm,android-arm64
          --dart-define=ERP_BASE_URL=$ERP_BASE_URL

      - name: Check the APK is signed with the release key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::The APK was signed with the debug key."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mynet-staff-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
