name: mynet_staff
description: "MyNet staff app: field and office staff of MyNet ISP (mynet-erp)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  connectivity_plus: ^7.3.2
  intl: ^0.20.3
  local_auth: ^3.0.2
  geolocator: ^13.0.4
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  device_info_plus: ^13.3.0
  mobile_scanner: ^7.5.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # The ERP's fonts (mynet-erp UI-13): Inter for Latin, Noto Sans Bengali for
  # Bangla. Bundled, so the app looks the same offline. OFL licences beside them.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
