  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  connectivity_plus: ^7.3.2
  intl: ^0.20.3
  local_auth: ^3.0.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
